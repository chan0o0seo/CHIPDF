name: macOS builds

on:
  workflow_dispatch:
  push:
    branches: [main, codex/macos-support]
    paths:
      - 'studio/**'
      - 'assets/**'
      - 'main.py'
      - '*macos*'
      - 'test_platform_support.py'
      - 'requirements*.txt'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install native dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-dev.txt -r requirements-inpaint.txt
      - name: Prepare OCR and LaMa assets
        run: |
          python prepare_assets.py
          python prepare_inpaint.py --download
      - name: Test editing and platform behavior
        run: python -m unittest test_platform_support test_recent_files test_studio test_text_mask test_inpaint_engine
      - name: Build app bundle
        run: python build_macos.py --with-inpaint
      - name: Verify packaged app, OCR and restoration
        run: python verify_macos.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ChiPDF-macOS-${{ matrix.arch }}
          path: |
            dist/macos-*/*.zip
            dist/macos-*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-QA-${{ matrix.arch }}
          path: |
            qa/macos/result.json
            qa/macos/open/*
            qa/macos/welcome/*
          if-no-files-found: ignore
          retention-days: 14
